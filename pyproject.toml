[project]
name = "bizlens"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django>=4.2,<5.1",
    "djangorestframework>=3.14.0",
    "djangorestframework-simplejwt>=5.3.0",
    "django-cors-headers>=4.3.0",
    "pandas>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "gunicorn>=22.0.0",
]

[tool.vercel]
entrypoint = "backend.config.asgi:application"